<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img">
  <title>ClipFlow 剪流 · 温润浅陶叠卡匣</title>
  <defs>
    <linearGradient id="shell" x1="512" y1="100" x2="512" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F8F3EA"/>
      <stop offset="0.52" stop-color="#EBE3D5"/>
      <stop offset="1" stop-color="#DDD2C1"/>
    </linearGradient>
    <linearGradient id="well" x1="512" y1="168" x2="512" y2="856" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#DAD1C2"/>
      <stop offset="1" stop-color="#E7E0D4"/>
    </linearGradient>
    <linearGradient id="cardTerracotta" x1="512" y1="210" x2="512" y2="550" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E4A88B"/>
      <stop offset="1" stop-color="#D69678"/>
    </linearGradient>
    <linearGradient id="cardCeladon" x1="512" y1="264" x2="512" y2="644" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#68B293"/>
      <stop offset="1" stop-color="#488D71"/>
    </linearGradient>
    <linearGradient id="cardHero" x1="512" y1="326" x2="512" y2="796" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFFFFD"/>
      <stop offset="1" stop-color="#F9F6F0"/>
    </linearGradient>
    <linearGradient id="pillSage" x1="258" y1="374" x2="366" y2="406" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#4F9B7C"/>
      <stop offset="1" stop-color="#36715A"/>
    </linearGradient>
    <linearGradient id="lipFill" x1="512" y1="664" x2="512" y2="856" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#F5EFE5"/>
      <stop offset="1" stop-color="#E1D7C7"/>
    </linearGradient>
    <clipPath id="cavityClip">
      <rect x="168" y="168" width="688" height="688" rx="140"/>
    </clipPath>
  </defs>

  <!-- Ceramic-Parchment Outer Squircle -->
  <rect x="100" y="100" width="824" height="824" rx="196" fill="url(#shell)" stroke="#FFFFFF" stroke-opacity="0.82" stroke-width="5"/>

  <!-- Warm Sand Recessed Cavity & Stepped Archival Cards -->
  <g clip-path="url(#cavityClip)">
    <rect x="168" y="168" width="688" height="688" rx="140" fill="url(#well)"/>
    <rect x="266" y="210" width="492" height="340" rx="58" fill="url(#cardTerracotta)" stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="2.5"/>
    <rect x="236" y="264" width="552" height="380" rx="64" fill="url(#cardCeladon)" stroke="#FFFFFF" stroke-opacity="0.65" stroke-width="2.5"/>
    <rect x="206" y="326" width="612" height="470" rx="72" fill="url(#cardHero)" stroke="#FFFFFF" stroke-opacity="0.96" stroke-width="3"/>
    <rect x="258" y="374" width="108" height="32" rx="16" fill="url(#pillSage)"/>
    <rect x="258" y="436" width="410" height="22" rx="11" fill="#403830" fill-opacity="0.66"/>
    <rect x="258" y="480" width="264" height="22" rx="11" fill="#403830" fill-opacity="0.30"/>

    <!-- Concave Thumb-Notch Front Pocket Lip -->
    <path d="M168 702 A38 38 0 0 1 206 664 H400 C452 664 472 698 512 698 C552 698 572 664 624 664 H818 A38 38 0 0 1 856 702 V718 A138 138 0 0 1 718 856 H306 A138 138 0 0 1 168 718 Z"
          fill="url(#lipFill)" stroke="#FFFFFF" stroke-opacity="0.88" stroke-width="3.5"/>
  </g>
</svg>
