name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: macos-15
    env:
      # The fixed local signing key stays on the developer's Mac.
      CLIPFLOW_ADHOC_SIGN: '1'
    defaults:
      run:
        shell: /bin/zsh {0}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Verify Swift toolchain and run tests
        run: |
          set -euo pipefail
          xcodebuild -version
          SWIFT_VERSION="$(xcrun swift --version)"
          echo "$SWIFT_VERSION"
          SWIFT_MAJOR="$(echo "$SWIFT_VERSION" | sed -nE 's/.*Swift version ([0-9]+).*/\1/p' | head -n 1)"
          if [[ -z "$SWIFT_MAJOR" ]] || (( SWIFT_MAJOR < 6 )); then
            echo "ClipFlow requires Xcode with Swift 6 or newer." >&2
            exit 1
          fi
          xcrun swift test

      - name: Prepare release metadata
        shell: /bin/zsh {0}
        run: |
          set -euo pipefail

          TAG_NAME="${GITHUB_REF_NAME}"
          NOTES_FILE="docs/releases/${TAG_NAME}.md"

          echo "TAG_NAME=${TAG_NAME}" >> "$GITHUB_ENV"
          echo "RELEASE_TITLE=ClipFlow ${TAG_NAME}" >> "$GITHUB_ENV"

          if [[ -f "$NOTES_FILE" ]]; then
            echo "RELEASE_NOTES_FILE=${NOTES_FILE}" >> "$GITHUB_ENV"
            echo "HAS_CUSTOM_NOTES=true" >> "$GITHUB_ENV"
          else
            echo "HAS_CUSTOM_NOTES=false" >> "$GITHUB_ENV"
          fi

      - name: Build app and DMGs (arm64 / x86_64 / universal)
        shell: /bin/zsh {0}
        run: zsh scripts/build_release_dmg.sh "${TAG_NAME}"

      - name: Ensure GitHub CLI is available
        shell: /bin/zsh {0}
        run: |
          set -euo pipefail
          if ! command -v gh >/dev/null 2>&1; then
            brew install gh
          fi

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: /bin/zsh {0}
        run: |
          set -euo pipefail

          ARTIFACTS=(
            "dist/release/ClipFlow-${TAG_NAME}-arm64.dmg"
            "dist/release/ClipFlow-${TAG_NAME}-arm64.dmg.sha256"
            "dist/release/ClipFlow-${TAG_NAME}-x86_64.dmg"
            "dist/release/ClipFlow-${TAG_NAME}-x86_64.dmg.sha256"
            "dist/release/ClipFlow-${TAG_NAME}-universal.dmg"
            "dist/release/ClipFlow-${TAG_NAME}-universal.dmg.sha256"
          )

          if gh release view "${TAG_NAME}" >/dev/null 2>&1; then
            if [[ "${HAS_CUSTOM_NOTES}" == "true" ]]; then
              gh release edit "${TAG_NAME}" \
                --draft=false \
                --title "${RELEASE_TITLE}" \
                --notes-file "${RELEASE_NOTES_FILE}"
            else
              gh release edit "${TAG_NAME}" --draft=false
            fi

            gh release upload "${TAG_NAME}" "${ARTIFACTS[@]}" --clobber
          else
            COMMON_ARGS=(
              --verify-tag
              --draft=false
              --title "${RELEASE_TITLE}"
            )

            if [[ "${HAS_CUSTOM_NOTES}" == "true" ]]; then
              gh release create "${TAG_NAME}" "${ARTIFACTS[@]}" \
                "${COMMON_ARGS[@]}" \
                --notes-file "${RELEASE_NOTES_FILE}"
            else
              gh release create "${TAG_NAME}" "${ARTIFACTS[@]}" \
                "${COMMON_ARGS[@]}" \
                --generate-notes
            fi
          fi
